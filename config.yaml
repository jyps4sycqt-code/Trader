# Weekly stock scanner configuration

budget:
  weekly_usd: 1000          # total $ deployed each week
  num_positions: 5          # number of stocks per basket
  cash_buffer_pct: 0.02     # leave 2% cash for slippage / partial-fill rounding

universe:
  # Source the scan universe from these tickers. We cache the union of
  # SP500 + Nasdaq100 in scanner/data.py. Override here if you want a
  # smaller curated list — e.g. ["AAPL", "MSFT", "NVDA", ...]
  source: "sp500_nasdaq100"
  min_market_cap_usd: 2_000_000_000     # filter sub-$2B
  min_avg_dollar_volume: 25_000_000     # need liquidity for ~$200 entries
  exclude_sectors: []                   # e.g. ["Financial Services"]
  exclude_tickers: []                   # add anything you don't want owned

screener:
  # "Underbought, mean-revert up over 1 week" heuristic.
  rsi_period: 14
  rsi_max: 35                # oversold cutoff
  sma_short: 50
  sma_long: 200
  pullback_pct_min: 2.0      # price must be at least 2% below 50-day SMA
  pullback_pct_max: 12.0     # but not more than 12% (avoid falling knives)
  require_above_sma_long: true   # 200-day uptrend must be intact
  volume_spike_min: 1.3      # 5d avg volume / 30d avg volume
  min_history_days: 220      # need 200d SMA + buffer

macro:
  # Defensive scaling based on broad-market regime.
  vix_high: 25.0             # VIX above this -> defensive mode
  vix_panic: 35.0            # VIX above this -> skip the week
  yield_curve_pair: ["^TNX", "^IRX"]   # 10y minus 13w T-bill
  defensive_rsi_max: 30      # stricter oversold cutoff in defensive mode
  defensive_pullback_max: 8  # tighter dip cap in defensive mode

news:
  lookback_days: 7
  # Hard kill words — if any headline contains these, drop the ticker.
  hard_negative_keywords:
    - "fraud"
    - "investigation"
    - "delisting"
    - "going concern"
    - "bankruptcy"
    - "accounting irregularit"
    - "restated"
    - "sec charges"
    - "fda rejects"
    - "guidance withdrawn"
  # Soft-positive nudge for these in last week's news.
  soft_positive_keywords:
    - "beats earnings"
    - "raises guidance"
    - "upgrade"
    - "buyback"
    - "record revenue"
    - "approves"

ranking:
  # Final composite score weights (each component normalized 0-1).
  weights:
    oversold: 0.30           # how oversold by RSI
    dip_quality: 0.25        # depth-of-dip relative to 50d, gated by 200d
    volume_signal: 0.15      # 5d/30d volume ratio
    fundamentals: 0.15       # earnings + reasonable valuation
    sentiment: 0.15          # news sentiment last 7d

execution:
  order_type: "MOO"          # market-on-open Monday
  fallback_order_type: "LIMIT"
  limit_buffer_pct: 0.5      # for LIMIT fallback, allow +0.5% over Friday close
  exit_order_type: "MOC"     # market-on-close Friday OR market-on-open Monday
  reports_dir: "reports"
  state_file: "state/positions.json"

git:
  enabled: true
  branch: "claude/weekly-stock-scanner-fZTSa"
  remote: "origin"
  user_name: "Trader Scanner"
  user_email: "trader-scanner@local"
